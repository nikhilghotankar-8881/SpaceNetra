# ==============================================================================
# Baseline Siamese U-Net Training Configuration — SpaceNetra
# ==============================================================================

model:
  architecture: "siamese_unet"
  backbone: "resnet18"
  pretrained: true
  in_channels: 3
  classes: 1

data:
  dataset: "levir_cd"
  patch_size: 256
  batch_size: 8
  num_workers: 4

training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  device: "auto"

loss:
  type: "bce_dice"
  bce_weight: 1.0
  dice_weight: 1.0
  smooth: 1.0

scheduler:
  type: "cosine_annealing"
  T_max: 50
  eta_min: 0.000001

checkpoint:
  save_dir: "checkpoints"
  save_name: "best_model.pth"
